name: CI

on:
  # Merges land on main and get no pull_request event, so main needs a push
  # trigger. Branches get their CI from pull_request.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# Least privilege by default; jobs opt in to what they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel only superseded PR runs; every commit on main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the
      # release's published checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The binary over full history, not the gitleaks action: the action's
      # push-event range is invalid on a repo's first push and scans nothing.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan full history
        run: ./gitleaks detect --source . --redact -v --exit-code 1

  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the key-stability test compares data/ with every
          # release tag and refuses a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      # Pinned inputs downloaded by the tests and the build, cached so CI
      # fetches from Door43 only when sources.json changes (about 8,000
      # files once every book's glossary inputs are pinned). A stale cache
      # cannot change the data: each file is named by its id and pinned
      # SHA-256, so a file from an older pin is never read, and every read
      # is hash-checked (scripts/lib/sources.ts), so a file that does not
      # match its pin is deleted and the run fails rather than use it. A
      # miss, or a partial restore from an older sources.json, fetches only
      # what is missing.
      - name: Cache pinned sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('sources.json') }}
          restore-keys: sources-

      # The release tags are the key check's baseline. Fetch them explicitly
      # rather than rely on actions/checkout's defaults: an empty tag list
      # reads as "never released" and skips every span comparison.
      - name: Fetch release tags
        run: git fetch --tags --force origin

      # data/ and dist/ are generated: rebuilding from the pinned sources
      # must reproduce the committed files exactly, none changed, missing or
      # extra. git diff alone misses untracked files, so test the status.
      # The build runs before the tests: it fetches any pinned input missing
      # from the cache several at a time, and the tests then read the same
      # files from the cache instead of one by one from Door43.
      - run: npm run build
      - name: Generated files match a fresh build
        run: |
          git status --porcelain --untracked-files=all -- data dist
          test -z "$(git status --porcelain --untracked-files=all -- data dist)"

      - run: npm run verify

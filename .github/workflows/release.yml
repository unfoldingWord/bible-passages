name: Release

# A pushed tag vX.Y.Z becomes a draft GitHub release with the files in
# dist/tc-mobile/ attached (docs/schema.md, "Releases"). The tag must match
# package.json, and the release is built from the pinned sources and checked
# exactly as CI checks main, plus the key-stability check against every
# release tag except this one. The draft is published by hand after a look.
#
# Run by hand (workflow_dispatch), it is a dry run: every step up to, not
# including, creating the release, at the dispatched commit, for the tag
# v<package.json version>. It creates no tag and no release, and has a
# read-only token. Both run scripts/release/run.sh, so a dry run exercises
# the release's own code path.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, for the key-stability check (tags fetched by the
          # script).
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Check, build and create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/run.sh "$GITHUB_REF_NAME"

  dry-run:
    name: Release dry run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Check and build, without creating a release
        run: bash scripts/release/run.sh --dry-run

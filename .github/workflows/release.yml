name: Release

# A pushed tag vX.Y.Z becomes a draft GitHub release with the files in
# dist/tc-mobile/ attached (docs/schema.md, "Releases"). The tag must match
# package.json, and the release is built from the pinned sources and checked
# exactly as CI checks main, plus the key-stability check against the tag
# before this one. The draft is published by hand after a look.

on:
  push:
    tags: ["v*"]

# Least privilege by default; only the release job may write.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history with tags, for the key-stability check.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      # The committed dist/ already carries package.json's version, so the
      # tag must name that version: bump package.json in a reviewed PR, then
      # tag the merge.
      - name: Tag is vX.Y.Z, matches package.json and is on main
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z."
            exit 1
          fi
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" FETCH_HEAD; then
            echo "::error::Tag $TAG is not on main."
            exit 1
          fi

      - run: npm ci

      # RELEASE_TAG makes the key-stability test compare with the tag
      # before this one rather than with this tag itself.
      - run: npm run verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      # As in CI: data/ and dist/ rebuilt from the pinned sources must match
      # the tagged files exactly.
      - run: npm run build
      - name: Generated files match a fresh build
        run: |
          git status --porcelain --untracked-files=all -- data dist
          test -z "$(git status --porcelain --untracked-files=all -- data dist)"

      # Only source.revision changes: it becomes the tag.
      - name: Build dist/ for the release
        run: node scripts/data/dist.ts
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      # Release assets are flat. Title tables (dist/tc-mobile/titles/) share
      # their package's file name, so attaching them needs a naming decision
      # first; until then a nested file stops the release rather than being
      # left out silently.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nested=$(find dist/tc-mobile -mindepth 2 -type f -name '*.json')
          if [ -n "$nested" ]; then
            echo "::error::Nested files in dist/tc-mobile/ have no release asset name yet: $nested"
            exit 1
          fi
          mapfile -t files < <(find dist/tc-mobile -maxdepth 1 -type f -name '*.json' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::dist/tc-mobile/ has no packages."
            exit 1
          fi
          grep -H '"revision"' "${files[@]}"
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes "tc-mobile template packages v0 for $TAG, built from the pinned sources in sources.json at this tag. See docs/schema.md, \"Releases\"."
